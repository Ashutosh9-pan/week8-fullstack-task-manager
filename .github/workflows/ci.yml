name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B clean test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Cypress E2E tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/taskflow-vite.log 2>&1 &
          VITE_PID=$!
          until curl -sf http://127.0.0.1:5173/login > /dev/null; do sleep 2; done
          set +e
          npm run test:e2e
          STATUS=$?
          kill $VITE_PID || true
          cat /tmp/taskflow-vite.log
          exit $STATUS
